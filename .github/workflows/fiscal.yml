name: fiscal-tests

on:
  pull_request:
    paths:
      - "src/components/fiscal/**"
      - "src/hooks/fiscal/**"
      - "src/pages/fiscal/**"
      - "src/services/fiscal/**"
      - "supabase/functions/_shared/fiscal/**"
      - "supabase/functions/fiscal-*/**"
      - "supabase/functions/fiscal-smoke-run/**"
      - "e2e/tests/06-fiscal-emissao.spec.ts"
      - ".github/workflows/fiscal.yml"
  push:
    branches: [main]

jobs:
  vitest:
    name: Vitest (frontend fiscal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vitest — módulo fiscal
        run: npx vitest run src/components/fiscal src/hooks/fiscal --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscal-vitest-coverage
          path: coverage/
          retention-days: 7

  deno:
    name: Deno tests (edge functions fiscais)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Deno test — fiscal edge functions
        env:
          FISCAL_MOCK: "true"
        run: |
          deno test \
            --allow-net --allow-env --allow-read \
            supabase/functions/fiscal-emitir-nfe/index.test.ts \
            supabase/functions/fiscal-cancelar-nfe/index.test.ts \
            supabase/functions/fiscal-cce-nfe/index.test.ts \
            supabase/functions/fiscal-signed-url/index.test.ts \
            supabase/functions/fiscal-upload-certificado/index.test.ts \
            supabase/functions/_shared/fiscal/mappers/__tests__/vendaToNFePayload.test.ts

  playwright:
    name: Playwright (fiscal e2e)
    runs-on: ubuntu-latest
    needs: [vitest, deno]
    env:
      E2E_USER: ${{ secrets.E2E_USER }}
      E2E_PASS: ${{ secrets.E2E_PASS }}
      E2E_ENABLED: '1'
      E2E_START_DEV_SERVER: '1'
      E2E_BASE_URL: http://localhost:3000
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write .env for Vite build
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
          } >> .env
      - run: npx playwright install --with-deps chromium
      - name: Playwright — fiscal spec
        env:
          FISCAL_MOCK: "true"
          E2E_FISCAL_ENABLED: "1"
        run: npx playwright test -c e2e/playwright.config.ts e2e/tests/06-fiscal-emissao.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscal-playwright-report
          path: playwright-report/
          retention-days: 7
